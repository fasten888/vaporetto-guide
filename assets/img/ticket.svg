<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="tkTitle tkDesc">
  <title id="tkTitle">A Venice vaporetto ticket</title>
  <desc id="tkDesc">Illustration of a cream ACTV-style ticket showing a single fare of nine euros fifty, valid for seventy-five minutes.</desc>
  <rect width="880" height="520" fill="#efe7d6"/>
  <g transform="rotate(-4 440 260)">
    <rect x="70" y="92" width="740" height="330" rx="8" fill="#fbf7ee" stroke="#bcae95" stroke-width="2"/>
    <rect x="70" y="92" width="740" height="70" rx="8" fill="#0d4a45"/>
    <rect x="70" y="140" width="740" height="22" fill="#0d4a45"/>
    <text x="104" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#f6f1e6" letter-spacing="3">VENEZIA · ACTV</text>
    <text x="770" y="136" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#e0a33e" letter-spacing="2">BIGLIETTO</text>

    <text x="104" y="220" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5c6762" letter-spacing="3">SINGLE FARE · 75 MIN</text>
    <text x="100" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#17211f">€ 9.50</text>
    <text x="106" y="354" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5c6762" letter-spacing="1">VALID ON ACTV WATERBUS &amp; LAND BUS</text>

    <line x1="600" y1="170" x2="600" y2="400" stroke="#bcae95" stroke-width="2" stroke-dasharray="7 7"/>
    <g fill="#0d4a45">
      <path d="M628 214h96l-12 20h-72z"/>
      <path d="M646 192h44v20h-44z"/>
      <path d="M654 198h10v8h-10zm18 0h10v8h-10z" fill="#f6f1e6"/>
    </g>
    <text x="676" y="270" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5c6762" letter-spacing="2">IMBARCADERO</text>
    <text x="676" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#17211f">Linea 1</text>
    <text x="676" y="326" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#5c6762">P.LE ROMA → LIDO</text>
    <g fill="#17211f" font-family="ui-monospace, Menlo, monospace" font-size="11">
      <text x="628" y="368">N. 004 271</text>
      <text x="628" y="386">20 · 10 · 2026</text>
    </g>

    <g stroke="#e0a33e" stroke-width="3" fill="none" opacity=".9">
      <path d="M70 422h740"/>
    </g>
    <g stroke="#0d4a45" stroke-width="2" fill="none" opacity=".55">
      <path d="M100 460c18-6 36-6 54 0s36 6 54 0 36-6 54 0"/>
      <path d="M560 460c18-6 36-6 54 0s36 6 54 0 36-6 54 0"/>
    </g>
  </g>
</svg>
