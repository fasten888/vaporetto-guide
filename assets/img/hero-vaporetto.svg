  </g>

  <!-- foreground ripples -->
  <g stroke="#9fc9bb" stroke-opacity=".32" stroke-linecap="round" fill="none">
    <path d="M40 650c22-6 44-6 66 0s44 6 66 0" stroke-width="2"/>
    <path d="M600 676c26-7 52-7 78 0s52 7 78 0" stroke-width="2"/>
    <path d="M200 720c30-8 60-8 90 0s60 8 90 0" stroke-width="2"/>
    <path d="M760 706c20-5 40-5 60 0s40 5 60 0" stroke-width="2"/>
  </g>
  <g fill="#f2e6d0" opacity=".5">
    <circle cx="470" cy="640" r="2"/>
    <circle cx="520" cy="664" r="1.6"/>
    <circle cx="380" cy="690" r="1.6"/>
    <circle cx="840" cy="648" r="2"/>
    <circle cx="180" cy="668" r="1.6"/>
  </g>
</svg>
