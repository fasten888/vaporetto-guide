<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">A vaporetto crossing the Venetian lagoon below the campanile of San Marco</title>
  <desc id="heroDesc">Editorial illustration of a cream and ochre Venice water bus, seen in profile, with the city skyline and mooring poles behind it.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e8d2"/>
      <stop offset=".62" stop-color="#efdfc4"/>
      <stop offset="1" stop-color="#e9d6b7"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c7d70"/>
      <stop offset=".28" stop-color="#0f544c"/>
      <stop offset="1" stop-color="#073b37"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset=".72" stop-color="#f2ead9"/>
      <stop offset="1" stop-color="#e3d7c2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4b46"/>
      <stop offset="1" stop-color="#132e2b"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c07a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f0c07a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="ripple" width="46" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 11c8-4 15-4 23 0s15 4 23 0" fill="none" stroke="#9fc9bb" stroke-opacity=".18" stroke-width="1.4"/>
    </pattern>
  </defs>

  <!-- sky -->
  <rect width="1000" height="760" fill="url(#sky)"/>
  <circle cx="792" cy="146" r="150" fill="url(#sunGlow)"/>
  <circle cx="792" cy="146" r="62" fill="#e8b46a"/>
  <circle cx="792" cy="146" r="76" fill="none" stroke="#e8b46a" stroke-opacity=".35"/>

  <g fill="#f8f0e1" opacity=".8">
    <ellipse cx="214" cy="126" rx="88" ry="9"/>
    <ellipse cx="268" cy="108" rx="52" ry="6"/>
    <ellipse cx="640" cy="88" rx="64" ry="6"/>
    <ellipse cx="878" cy="250" rx="72" ry="7"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#5c6762" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M590 188c7-7 12-7 19 0 7-7 12-7 19 0"/>
    <path d="M648 156c5-5 9-5 14 0 5-5 9-5 14 0"/>
    <path d="M540 150c4-4 7-4 11 0 4-4 7-4 11 0"/>
  </g>

  <!-- distant skyline -->
  <g opacity=".55">
    <rect x="40" y="352" width="920" height="60" fill="#c3ae90"/>
    <rect x="60" y="330" width="70" height="26" fill="#cbb79a"/>
    <rect x="380" y="338" width="120" height="22" fill="#c9b596"/>
    <rect x="520" y="330" width="150" height="30" fill="#cbb79a"/>
    <rect x="700" y="342" width="120" height="18" fill="#c9b596"/>
  </g>

  <!-- campanile -->
  <g>
    <rect x="120" y="196" width="54" height="204" fill="#bfa17d"/>
    <rect x="120" y="196" width="54" height="204" fill="none" stroke="#a98a66" stroke-width="2"/>
    <rect x="114" y="188" width="66" height="14" fill="#a98a66"/>
    <path d="M114 188h66l-33-46z" fill="#8f7353"/>
    <rect x="132" y="214" width="8" height="24" fill="#f1e4cc" opacity=".7"/>
    <rect x="154" y="214" width="8" height="24" fill="#f1e4cc" opacity=".7"/>
    <rect x="132" y="300" width="30" height="42" fill="#8f7353" opacity=".55"/>
    <circle cx="147" cy="176" r="5" fill="#e0a33e"/>
  </g>

  <!-- basilica domes -->
  <g fill="#c7ad8b" stroke="#a98a66" stroke-width="2">
    <rect x="206" y="330" width="148" height="70"/>
    <path d="M212 330c0-18 14-32 31-32s31 14 31 32z"/>
    <path d="M272 330c0-20 15-36 34-36s34 16 34 36z"/>
    <path d="M326 330c0-16 13-29 28-29s28 13 28 29z"/>
    <path d="M210 330h140" stroke-width="2"/>
    <g fill="#8f7353" stroke="none" opacity=".55">
      <rect x="226" y="354" width="10" height="22"/>
      <rect x="252" y="354" width="10" height="22"/>
      <rect x="302" y="354" width="10" height="22"/>
      <rect x="328" y="354" width="10" height="22"/>
    </g>
    <path d="M243 288v-22m0 0h-6m6 0h6" fill="none"/>
    <path d="M306 280v-24m0 0h-6m6 0h6" fill="none"/>
  </g>

  <!-- palazzi -->
  <g stroke="#a98a66" stroke-width="1.5">
    <rect x="384" y="300" width="100" height="100" fill="#d3bd9b"/>
    <rect x="496" y="312" width="76" height="88" fill="#c9b190"/>
    <rect x="584" y="292" width="120" height="108" fill="#d8c3a3"/>
    <rect x="716" y="316" width="92" height="84" fill="#cdb694"/>
    <rect x="820" y="304" width="120" height="96" fill="#d5bf9d"/>
  </g>
  <g fill="#8f7353" opacity=".5">
    <rect x="398" y="326" width="9" height="20"/><rect x="420" y="326" width="9" height="20"/>
    <rect x="442" y="326" width="9" height="20"/><rect x="464" y="326" width="9" height="20"/>
    <rect x="508" y="336" width="8" height="18"/><rect x="530" y="336" width="8" height="18"/>
    <rect x="552" y="336" width="8" height="18"/>
    <rect x="598" y="318" width="10" height="22"/><rect x="624" y="318" width="10" height="22"/>
    <rect x="650" y="318" width="10" height="22"/><rect x="676" y="318" width="10" height="22"/>
    <rect x="730" y="338" width="9" height="18"/><rect x="754" y="338" width="9" height="18"/>
    <rect x="778" y="338" width="9" height="18"/>
    <rect x="838" y="326" width="10" height="20"/><rect x="866" y="326" width="10" height="20"/>
    <rect x="894" y="326" width="10" height="20"/><rect x="918" y="326" width="10" height="20"/>
  </g>

