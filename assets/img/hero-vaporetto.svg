    <rect x="740" y="420" width="120" height="2"/>
    <rect x="120" y="416" width="180" height="3"/>
    <rect x="300" y="426" width="90" height="2"/>
  </g>

  <!-- mooring poles left -->
  <g>
    <g transform="rotate(-5 96 520)">
      <rect x="88" y="350" width="15" height="230" fill="#efe2c9"/>
      <rect x="88" y="350" width="15" height="34" fill="#b8472a"/>
      <rect x="88" y="384" width="15" height="30" fill="#0d4a45"/>
      <rect x="88" y="414" width="15" height="30" fill="#efe2c9"/>
      <rect x="88" y="444" width="15" height="30" fill="#b8472a"/>
