    <g transform="rotate(6 926 540)">
      <rect x="918" y="370" width="14" height="220" fill="#efe2c9"/>
      <rect x="918" y="370" width="14" height="30" fill="#b8472a"/>
      <rect x="918" y="430" width="14" height="28" fill="#0d4a45"/>
      <rect x="918" y="490" width="14" height="28" fill="#b8472a"/>
    </g>
    <g transform="rotate(-3 966 560)">
      <rect x="960" y="414" width="12" height="170" fill="#e7d9bf"/>
      <rect x="960" y="414" width="12" height="24" fill="#0d4a45"/>
    </g>
  </g>

  <!-- vaporetto reflection -->
  <g opacity=".32" fill="#052f2c">
    <ellipse cx="520" cy="606" rx="290" ry="20"/>
  </g>
  <g opacity=".5" fill="#f2e6d0">
    <rect x="320" y="596" width="40" height="3"/>
    <rect x="380" y="602" width="26" height="3"/>
    <rect x="430" y="596" width="60" height="3"/>
    <rect x="640" y="600" width="44" height="3"/>
  </g>

