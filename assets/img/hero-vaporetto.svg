    <g transform="rotate(4 132 540)">
      <rect x="126" y="396" width="13" height="190" fill="#e7d9bf"/>
      <rect x="126" y="396" width="13" height="26" fill="#0d4a45"/>
      <rect x="126" y="422" width="13" height="22" fill="#b8472a"/>
    </g>
