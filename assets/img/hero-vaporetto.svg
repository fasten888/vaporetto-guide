  <g>
    <!-- hull -->
    <path d="M248 512H742l66 24-8 26c-4 12-15 20-28 20H292c-14 0-25-8-29-21l-15-49Z" fill="url(#hull)" stroke="#0b3834" stroke-width="2"/>
    <path d="M263 552h530l-5 18c-3 8-10 12-19 12H292c-9 0-16-5-19-13l-10-17Z" fill="#0b3834"/>
    <path d="M263 544h538" stroke="#e0a33e" stroke-width="7"/>
    <path d="M250 516h520" stroke="#b8472a" stroke-width="4"/>

    <!-- name board -->
    <rect x="300" y="520" width="92" height="16" fill="#0d4a45"/>
    <g fill="#f2e6d0">
      <rect x="306" y="525" width="4" height="6"/>
      <rect x="314" y="525" width="3" height="6"/>
      <rect x="321" y="525" width="4" height="6"/>
      <rect x="329" y="525" width="3" height="6"/>
      <rect x="336" y="525" width="4" height="6"/>
      <rect x="345" y="525" width="3" height="6"/>
      <rect x="352" y="525" width="4" height="6"/>
      <rect x="360" y="525" width="3" height="6"/>
    </g>

    <!-- lower cabin windows -->
    <g fill="url(#glass)" stroke="#0b3834" stroke-width="1.5">
      <rect x="404" y="522" width="34" height="14"/>
      <rect x="446" y="522" width="34" height="14"/>
      <rect x="488" y="522" width="34" height="14"/>
      <rect x="530" y="522" width="34" height="14"/>
    </g>

    <!-- main cabin -->
    <path d="M330 438h366v74H330z" fill="#f8f3e6" stroke="#0b3834" stroke-width="2"/>
    <path d="M696 438l44 24v50h-44z" fill="#f8f3e6" stroke="#0b3834" stroke-width="2"/>
    <path d="M300 438h430l-14-18H314z" fill="#e0d2b8" stroke="#0b3834" stroke-width="2"/>
    <path d="M330 438h366" stroke="#e0a33e" stroke-width="4"/>

    <!-- windows -->
    <g fill="url(#glass)" stroke="#0b3834" stroke-width="2">
      <rect x="342" y="454" width="44" height="40"/>
      <rect x="394" y="454" width="44" height="40"/>
      <rect x="446" y="454" width="44" height="40"/>
      <rect x="498" y="454" width="44" height="40"/>
      <rect x="550" y="454" width="44" height="40"/>
      <rect x="602" y="454" width="44" height="40"/>
      <rect x="654" y="454" width="34" height="40"/>
      <path d="M702 458l30 16v18h-30z"/>
    </g>
    <g fill="#f2e6d0" opacity=".22">
      <rect x="345" y="457" width="10" height="34"/>
      <rect x="397" y="457" width="10" height="34"/>
      <rect x="449" y="457" width="10" height="34"/>
      <rect x="501" y="457" width="10" height="34"/>
      <rect x="553" y="457" width="10" height="34"/>
      <rect x="605" y="457" width="10" height="34"/>
    </g>

    <!-- passengers silhouettes -->
    <g fill="#17302e">
      <circle cx="362" cy="470" r="5"/>
      <path d="M355 475h14l3 19h-20z"/>
      <circle cx="414" cy="466" r="5"/>
      <path d="M407 471h14l3 23h-20z"/>
      <circle cx="619" cy="470" r="5"/>
      <path d="M612 475h14l3 19h-20z"/>
    </g>
    <g fill="#b8472a">
      <circle cx="518" cy="466" r="5"/>
      <path d="M511 471h14l3 23h-20z"/>
    </g>

    <!-- stern open deck -->
    <path d="M300 512v-40h30v40z" fill="#e9dcc4" stroke="#0b3834" stroke-width="2"/>
    <g stroke="#0b3834" stroke-width="2">
      <path d="M300 476h30"/>
      <path d="M306 476v36M316 476v36M326 476v36"/>
    </g>

    <!-- life ring -->
    <g>
      <circle cx="706" cy="520" r="11" fill="#f8f3e6" stroke="#b8472a" stroke-width="3"/>
      <circle cx="706" cy="520" r="4" fill="#0d4a45"/>
    </g>

    <!-- roof details -->
    <path d="M338 420h350" stroke="#0b3834" stroke-width="2"/>
    <rect x="380" y="404" width="52" height="16" fill="#12695f" stroke="#0b3834" stroke-width="1.5"/>
    <rect x="470" y="404" width="72" height="16" fill="#12695f" stroke="#0b3834" stroke-width="1.5"/>
    <circle cx="686" cy="430" r="4" fill="#e0a33e"/>

    <!-- bow rail -->
    <g stroke="#0b3834" stroke-width="2" fill="none">
      <path d="M736 512l14-16h34l20 16"/>
      <path d="M750 496v16M766 496v16M782 496v16"/>
    </g>

    <!-- wake -->
    <g stroke="#f6f1e6" stroke-linecap="round" fill="none" opacity=".75">
      <path d="M248 566c-40 8-78 10-118 8" stroke-width="4"/>
      <path d="M240 582c-54 10-104 12-156 8" stroke-width="3" opacity=".55"/>
      <path d="M300 596c-30 6-58 6-88 2" stroke-width="3" opacity=".4"/>
      <path d="M806 556c28 2 52 0 74-6" stroke-width="3" opacity=".5"/>
