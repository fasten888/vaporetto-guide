  <rect y="396" width="1000" height="364" fill="url(#water)"/>
  <rect y="396" width="1000" height="364" fill="url(#ripple)"/>
  <g stroke="#b9ded1" stroke-opacity=".28" stroke-linecap="round">
    <path d="M0 430h1000" stroke-width="1"/>
    <path d="M0 452h1000" stroke-width="1.4"/>
    <path d="M0 710h1000" stroke-width="1.6"/>
    <path d="M0 736h1000" stroke-width="1"/>
  </g>
  <g fill="#f2e6d0" opacity=".18">
